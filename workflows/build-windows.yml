name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name DynamicLotMainMenu `
            --add-data "assets/Main_Menu_Dynamic_Template.package;." `
            src/TS4_Lot_Menu_Updater.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\DynamicLotMainMenu | Out-Null
          Copy-Item dist\DynamicLotMainMenu.exe release\DynamicLotMainMenu\
          Copy-Item Update_Main_Menu.bat release\DynamicLotMainMenu\
          Copy-Item Update_And_Launch_TS4.bat release\DynamicLotMainMenu\
          Copy-Item README.md release\DynamicLotMainMenu\
          Copy-Item LICENSE release\DynamicLotMainMenu\
          Compress-Archive -Path release\DynamicLotMainMenu\* -DestinationPath release\DynamicLotMainMenu-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicLotMainMenu-Windows
          path: release/DynamicLotMainMenu-Windows.zip

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/DynamicLotMainMenu-Windows.zip
